name: Build Full Version & Release (Smart)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout this fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/unchihugo/FluentFlyout.git || true
          git fetch upstream
          git checkout master || git checkout main
          git merge upstream/master --no-edit || git merge upstream/main --no-edit
          git push origin HEAD || true

      - name: Get latest official release tag
        id: official
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest"
          $tag = $response.tag_name
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "name=FluentFlyout $tag (Full Auto Build)" >> $env:GITHUB_OUTPUT
          echo "full_tag=${tag}-full" >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        shell: pwsh
        run: |
          $tag = "${{ steps.official.outputs.full_tag }}"
          try {
            $null = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists - skipping build."
          } catch {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No existing release for $tag - will build."
          }

      - name: Setup .NET 10
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.check.outputs.exists != 'true'
        run: dotnet restore FluentFlyout.sln

      - name: Publish Full Version (x64) - folder mode
        if: steps.check.outputs.exists != 'true'
        run: |
          dotnet publish FluentFlyoutWPF/FluentFlyout.csproj -c "GitHub Release" -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Install Inno Setup
        if: steps.check.outputs.exists != 'true'
        run: choco install innosetup -y --no-progress

      - name: Create Inno Setup script
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.official.outputs.tag }}".TrimStart('v')
          $iss = @"
#define MyAppName "FluentFlyout"
#define MyAppVersion "$version"
#define MyAppPublisher "Unofficial Auto Build"
#define MyAppURL "https://github.com/tailscalelogin69/FluentFlyout-AutoBuild"
#define MyAppExeName "FluentFlyout.exe"

[Setup]
AppId={{A1B2C3D4-E5F6-7890-ABCD-EF1234567890}
AppName={#MyAppName}
AppVersion={#MyAppVersion}
AppPublisher={#MyAppPublisher}
AppPublisherURL={#MyAppURL}
AppSupportURL={#MyAppURL}
DefaultDirName={autopf}\{#MyAppName}
DefaultGroupName={#MyAppName}
DisableProgramGroupPage=yes
OutputDir=installer
OutputBaseFilename=FluentFlyout-{#MyAppVersion}-Full-Setup
Compression=lzma2
SolidCompression=yes
WizardStyle=modern
PrivilegesRequired=lowest
ArchitecturesAllowed=x64compatible
ArchitecturesInstallIn64BitMode=x64compatible
UninstallDisplayIcon={app}\{#MyAppExeName}

[Languages]
Name: "english"; MessagesFile: "compiler:Default.isl"

[Tasks]
Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

[Files]
Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

[Run]
Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
"@
          $iss | Out-File -FilePath "setup.iss" -Encoding utf8

      - name: Compile Installer
        if: steps.check.outputs.exists != 'true'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss

      - name: Create Release
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.official.outputs.full_tag }}
          name: ${{ steps.official.outputs.name }}
          body: |
            **Unofficial automatic full build** of FluentFlyout `${{ steps.official.outputs.tag }}`

            - Configuration: **GitHub Release** (all features unlocked)
            - Architecture: x64
            - Self-contained + proper installer

            ### How to install
            1. Download `FluentFlyout-*-Full-Setup.exe`
            2. Run the installer
            3. Launch FluentFlyout from Start Menu or Desktop

            This is an unofficial automated build. Official project: https://github.com/unchihugo/FluentFlyout
          files: installer/FluentFlyout-*-Full-Setup.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
