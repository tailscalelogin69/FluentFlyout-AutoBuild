name: Build Full Version & Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/unchihugo/FluentFlyout.git || true
          git fetch upstream
          git checkout master || git checkout main
          git merge upstream/master --no-edit || git merge upstream/main --no-edit
          git push origin HEAD || true

      - name: Get latest official tag
        id: official
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/unchihugo/FluentFlyout/releases/latest"
          $tag = $response.tag_name
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "name=FluentFlyout $tag (Full Auto Build)" >> $env:GITHUB_OUTPUT
          echo "full_tag=${tag}-full" >> $env:GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        shell: pwsh
        run: |
          $tag = "${{ steps.official.outputs.full_tag }}"
          try {
            $null = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists - skipping."
          } catch {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No existing release - will build."
          }

      - name: Setup .NET 10
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.check.outputs.exists != 'true'
        run: dotnet restore FluentFlyout.sln

      - name: Publish
        if: steps.check.outputs.exists != 'true'
        run: |
          dotnet publish FluentFlyoutWPF/FluentFlyout.csproj `
            -c "GitHub Release" `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:ApplicationIcon=Resources\FluentFlyout2.ico `
            -o publish

      - name: Zip
        if: steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "FluentFlyout-${{ steps.official.outputs.tag }}-Full-x64.zip" -Force

      - name: Create Release
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.official.outputs.full_tag }}
          name: ${{ steps.official.outputs.name }}
          body: |
            **Unofficial automatic full build** of FluentFlyout `${{ steps.official.outputs.tag }}`

            - Configuration: **GitHub Release** (all features unlocked)
            - Architecture: x64
            - Self-contained

            ### How to use
            1. Download the zip
            2. Extract it anywhere
            3. Run `FluentFlyout.exe`

            This is an unofficial automated build.
            Official project: https://github.com/unchihugo/FluentFlyout
          files: FluentFlyout-*-Full-x64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
